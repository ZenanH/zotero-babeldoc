name: Check upstream versions

on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check Zotero and BabelDOC versions
        uses: actions/github-script@v7
        with:
          script: |
            const supportedZoteroMajor = 10;
            const pinnedBabeldoc = "0.6.4";
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const zotero = await github.request(
              "GET /repos/zotero/zotero/releases/latest",
            );
            const zoteroTag = String(zotero.data.tag_name || "");
            const zoteroMatch = zoteroTag.match(/(\d+)(?:\.\d+)?/);
            const latestZoteroMajor = zoteroMatch
              ? Number(zoteroMatch[1])
              : null;

            const babeldocResponse = await fetch(
              "https://pypi.org/pypi/BabelDOC/json",
            );
            if (!babeldocResponse.ok) {
              throw new Error(
                `PyPI request failed with ${babeldocResponse.status}`,
              );
            }
            const babeldoc = await babeldocResponse.json();
            const latestBabeldoc = String(babeldoc.info?.version || "");

            const parseVersion = (value) =>
              value
                .split(".")
                .slice(0, 3)
                .map((part) => Number.parseInt(part, 10) || 0);
            const compareVersions = (left, right) => {
              const a = parseVersion(left);
              const b = parseVersion(right);
              for (let index = 0; index < 3; index += 1) {
                if (a[index] !== b[index]) return a[index] - b[index];
              }
              return 0;
            };

            const findings = [];
            if (
              latestZoteroMajor !== null &&
              latestZoteroMajor > supportedZoteroMajor
            ) {
              findings.push(
                `- Zotero 最新版本为 **${zoteroTag}**，插件当前只声明支持 Zotero ${supportedZoteroMajor}。`,
              );
            }
            if (
              latestBabeldoc &&
              compareVersions(latestBabeldoc, pinnedBabeldoc) > 0
            ) {
              findings.push(
                `- BabelDOC 最新版本为 **${latestBabeldoc}**，插件当前固定 **${pinnedBabeldoc}**。`,
              );
            }

            if (findings.length === 0) {
              core.info(
                `No upstream upgrade requiring attention. Zotero ${zoteroTag}, BabelDOC ${latestBabeldoc}.`,
              );
              return;
            }

            const title = "Upstream version update requires review";
            const existing = await github.paginate(
              github.rest.issues.listForRepo,
              { owner, repo, state: "open" },
            );
            if (existing.some((issue) => issue.title === title)) {
              core.info("An open upstream-version issue already exists.");
              return;
            }

            const body = [
              "@ZenanH 上游版本检查发现需要人工确认的更新：",
              "",
              ...findings,
              "",
              `- Zotero 最新发行版：${zotero.data.html_url}`,
              "- BabelDOC：https://pypi.org/project/BabelDOC/",
              "",
              "请检查兼容性、更新插件约束和测试矩阵；确认后关闭此 Issue。",
            ].join("\n");

            await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
            });
