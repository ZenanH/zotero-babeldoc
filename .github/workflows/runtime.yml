name: Validate BabelDOC runtime

on:
  push:
    branches: [main]
    paths:
      - "runtime/**"
      - "package.json"
      - ".github/workflows/runtime.yml"
  pull_request:
    paths:
      - "runtime/**"
      - "package.json"
      - ".github/workflows/runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.13"

      - name: Verify lockfile
        run: uv lock --directory runtime --check

      - name: Install pinned Python
        run: uv python install 3.12.13

      - name: Create isolated environment
        run: uv venv --python 3.12.13 .venv

      - name: Install hash-locked dependencies on Unix
        if: runner.os != 'Windows'
        run: uv pip sync runtime/requirements.lock --python .venv/bin/python --require-hashes --strict

      - name: Install hash-locked dependencies on Windows
        if: runner.os == 'Windows'
        run: uv pip sync runtime/requirements.lock --python .venv/Scripts/python.exe --require-hashes --strict

      - name: Verify BabelDOC version on Unix
        if: runner.os != 'Windows'
        run: .venv/bin/babeldoc --version

      - name: Verify BabelDOC version on Windows
        if: runner.os == 'Windows'
        run: .venv/Scripts/babeldoc.exe --version
