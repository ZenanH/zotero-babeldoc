<groupbox
  id="babeldoctranslator-preferences"
  onload="Zotero.BabelDocTranslator.hooks.onPrefsEvent('load', { window })"
>
  <description>
    在 Zotero 中使用本机 BabelDOC 翻译 PDF，并将结果保存到原文献下。
  </description>

  <groupbox>
    <label><html:h3>翻译环境</html:h3></label>
    <description id="babeldoctranslator-babeldoc-status" />
    <hbox align="center" style="margin-top: 8px">
      <button id="babeldoctranslator-deploy" label="配置 / 修复环境" />
      <button
        id="babeldoctranslator-detect"
        label="检查环境"
        style="margin-left: 10px"
      />
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h3>模型连接</html:h3></label>
    <description
      >填写兼容 OpenAI 接口的 Base URL、API Key 和模型名称。</description
    >
    <vbox flex="1">
      <vbox style="margin-bottom: 8px">
        <html:label for="babeldoctranslator-base-url">Base URL</html:label>
        <html:input
          id="babeldoctranslator-base-url"
          type="url"
          flex="1"
          placeholder="https://api.openai.com/v1"
        />
        <description
          >填写服务商提供的 API 根地址，通常以 /v1 结尾，例如
          https://sudeng.cc/v1。不要填写 /chat/completions 或
          /responses。</description
        >
      </vbox>
      <vbox style="margin-bottom: 8px">
        <html:label for="babeldoctranslator-api-mode">API 格式</html:label>
        <html:select id="babeldoctranslator-api-mode">
          <html:option value="chat-completions">Chat Completions</html:option>
          <html:option value="responses">Responses</html:option>
        </html:select>
      </vbox>
      <vbox style="margin-bottom: 8px">
        <html:label for="babeldoctranslator-api-key">API Key</html:label>
        <html:input
          id="babeldoctranslator-api-key"
          type="password"
          flex="1"
          autocomplete="off"
        />
      </vbox>
      <vbox>
        <html:label for="babeldoctranslator-model">模型名称</html:label>
        <html:input
          id="babeldoctranslator-model"
          type="text"
          flex="1"
          placeholder="gpt-4o-mini"
        />
      </vbox>
      <vbox style="margin-top: 8px">
        <html:label for="babeldoctranslator-reasoning-effort"
          >推理强度</html:label
        >
        <html:select id="babeldoctranslator-reasoning-effort" flex="1">
          <html:option value="low">low（默认）</html:option>
          <html:option value="medium">medium</html:option>
          <html:option value="high">high</html:option>
          <html:option value="xhigh">xhigh</html:option>
          <html:option value="max">max</html:option>
          <html:option value="omit">使用服务默认值（省略参数）</html:option>
        </html:select>
        <description>按模型服务商支持的推理强度选择。</description>
      </vbox>
    </vbox>
  </groupbox>

  <groupbox>
    <label><html:h3>语言与输出</html:h3></label>
    <vbox flex="1">
      <vbox style="margin-bottom: 8px">
        <html:label for="babeldoctranslator-source-language">源语言</html:label>
        <html:input
          id="babeldoctranslator-source-language"
          type="text"
          flex="1"
          placeholder="en"
        />
      </vbox>
      <vbox style="margin-bottom: 8px">
        <html:label for="babeldoctranslator-target-language"
          >导出语言</html:label
        >
        <html:input
          id="babeldoctranslator-target-language"
          type="text"
          flex="1"
          placeholder="zh-CN"
        />
      </vbox>
      <hbox flex="1" align="start">
        <vbox flex="1" style="margin-right: 8px">
          <html:label for="babeldoctranslator-qps">请求速率</html:label>
          <html:input
            id="babeldoctranslator-qps"
            type="number"
            min="1"
            max="64"
            step="1"
            value="10"
          />
        </vbox>
        <vbox flex="1">
          <html:label for="babeldoctranslator-workers">处理线程</html:label>
          <html:input
            id="babeldoctranslator-workers"
            type="number"
            min="1"
            max="64"
            step="1"
            value="8"
          />
        </vbox>
      </hbox>
    </vbox>
    <vbox>
      <html:label>
        <html:input
          id="babeldoctranslator-output-mono"
          type="radio"
          name="babeldoctranslator-output-mode"
          value="mono"
        />
        仅导出翻译 PDF
      </html:label>
      <html:label>
        <html:input
          id="babeldoctranslator-output-dual"
          type="radio"
          name="babeldoctranslator-output-mode"
          value="dual"
        />
        导出原文 + 译文 PDF
      </html:label>
    </vbox>
  </groupbox>

  <hbox align="center" pack="end" style="margin-top: 10px">
    <button id="babeldoctranslator-test" label="测试连接" />
    <button
      id="babeldoctranslator-save"
      label="保存设置"
      style="margin-left: 10px"
    />
  </hbox>
  <description id="babeldoctranslator-status" />
</groupbox>
