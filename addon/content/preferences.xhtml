<groupbox
  id="babeldoctranslator-preferences"
  onload="Zotero.BabelDocTranslator.hooks.onPrefsEvent('load', { window })"
>
  <label><html:h2>Zotero BabelDOC</html:h2></label>
  <description>
    在 Zotero 中使用本机 BabelDOC 翻译 PDF，并将结果保存到原文献下。
  </description>

  <groupbox>
    <label><html:h3>翻译环境</html:h3></label>
    <description id="babeldoctranslator-babeldoc-status" />
    <hbox align="center" style="margin-top: 8px">
      <button id="babeldoctranslator-deploy" label="配置 / 修复环境" />
      <button id="babeldoctranslator-detect" label="检查环境" />
    </hbox>
  </groupbox>

  <groupbox>
    <label><html:h3>模型连接</html:h3></label>
    <description
      >填写兼容 OpenAI 接口的 Base URL、API Key 和模型名称。</description
    >
    <grid flex="1">
      <columns>
        <column flex="0" />
        <column flex="1" />
      </columns>
      <rows>
        <row align="center">
          <html:label for="babeldoctranslator-base-url">Base URL</html:label>
          <html:input
            id="babeldoctranslator-base-url"
            type="url"
            flex="1"
            placeholder="https://api.openai.com/v1"
          />
        </row>
        <row align="center">
          <html:label for="babeldoctranslator-api-key">API Key</html:label>
          <html:input
            id="babeldoctranslator-api-key"
            type="password"
            flex="1"
            autocomplete="off"
          />
        </row>
        <row align="center">
          <html:label for="babeldoctranslator-model">模型名称</html:label>
          <html:input
            id="babeldoctranslator-model"
            type="text"
            flex="1"
            placeholder="gpt-4o-mini"
          />
        </row>
      </rows>
    </grid>
  </groupbox>

  <groupbox>
    <label><html:h3>语言与输出</html:h3></label>
    <grid flex="1">
      <columns>
        <column flex="0" />
        <column flex="1" />
      </columns>
      <rows>
        <row align="center">
          <html:label for="babeldoctranslator-source-language"
            >源语言</html:label
          >
          <html:input
            id="babeldoctranslator-source-language"
            type="text"
            flex="1"
            placeholder="en"
          />
        </row>
        <row align="center">
          <html:label for="babeldoctranslator-target-language"
            >导出语言</html:label
          >
          <html:input
            id="babeldoctranslator-target-language"
            type="text"
            flex="1"
            placeholder="zh-CN"
          />
        </row>
        <row align="center">
          <html:label for="babeldoctranslator-qps">请求速率</html:label>
          <html:input
            id="babeldoctranslator-qps"
            type="number"
            min="1"
            max="64"
            step="1"
            value="10"
          />
        </row>
        <row align="center">
          <html:label for="babeldoctranslator-workers">处理线程</html:label>
          <html:input
            id="babeldoctranslator-workers"
            type="number"
            min="1"
            max="64"
            step="1"
            value="8"
          />
        </row>
      </rows>
    </grid>
    <vbox>
      <html:label>
        <html:input
          id="babeldoctranslator-output-mono"
          type="radio"
          name="babeldoctranslator-output-mode"
          value="mono"
        />
        仅导出翻译 PDF
      </html:label>
      <html:label>
        <html:input
          id="babeldoctranslator-output-dual"
          type="radio"
          name="babeldoctranslator-output-mode"
          value="dual"
        />
        导出原文 + 译文 PDF
      </html:label>
    </vbox>
  </groupbox>

  <hbox align="center" pack="end" style="margin-top: 10px">
    <button id="babeldoctranslator-test" label="测试连接" />
    <button id="babeldoctranslator-save" label="保存设置" />
  </hbox>
  <description id="babeldoctranslator-status" />
</groupbox>
